services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PROWLER_REPO: ${PROWLER_REPO:-https://github.com/prowler-cloud/prowler.git}
        PROWLER_REF: ${PROWLER_REF:-master}
    environment:
      - DATA_DIR=/data
      - PORT=3001
      - COMPLIANCE_DIR=/compliance
      - CHECK_METADATA_DIR=/check-metadata
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    volumes:
      - prowler_data:/data
    restart: unless-stopped

volumes:
  prowler_data:
    driver: local
