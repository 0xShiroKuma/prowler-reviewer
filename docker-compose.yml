services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - DATA_DIR=/data
      - PORT=3001
      - COMPLIANCE_DIR=/compliance
      - CHECK_METADATA_DIR=/check-metadata
    volumes:
      - prowler_data:/data
      - ./resources/compliance:/compliance:ro
      - ./resources/check-metadata:/check-metadata:ro
    restart: unless-stopped

volumes:
  prowler_data:
    driver: local
